{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h3 class="mb-4">Задача "{{task[0]}}"</h3>

    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <dl class="row">

                        <dt class="col-sm-4">Дедлайн:</dt>
                        <dd class="col-sm-8">{{ task[1] }}</dd>

                        <dt class="col-sm-4">Приоритет:</dt>
                        <dd class="col-sm-8">{{ task[2] }}</dd>

                        <dt class="col-sm-4">Статус:</dt>
                        <dd class="col-sm-8">{{ task[3] }}</dd>

                        <dt class="col-sm-4">Исполнитель:</dt>
                        <dd class="col-sm-8">{{ owner[0] }}</dd>

                        <dt class="col-sm-4">Создатель:</dt>
                        <dd class="col-sm-8">{{ executor[0] }}</dd>

                        <dt class="col-sm-4">Описание:</dt>
                        <dd class="col-sm-8">{{ task[4] }}</dd>

                    </dl>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-8">
            <div class="d-grid gap-2">

            </div>
        </div>
    </div>
</div>

{% endblock %}
